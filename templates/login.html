<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bike Repair System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --charcoal: #1A1D23;
            --amber: #D97B3F;
            --amber-dark: #B8632E;
            --cream: #F7F5F2;
            --ink: #2B2B2B;
            --ink-muted: #6B6B6B;
            --border-soft: #E5E1DA;
            --rust: #C44536;
        }

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, var(--charcoal) 0%, #2D3139 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--ink);
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            padding: 0 1.5rem;
        }

        .login-card {
            background-color: #FFFFFF;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 2.5rem 2rem;
            border-top: 4px solid var(--amber);
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .logo {
            font-size: 2.4rem;
            margin-bottom: 0.5rem;
        }

        .login-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--charcoal);
            margin-bottom: 0.3rem;
        }

        .login-header p {
            font-size: 0.9rem;
            color: var(--ink-muted);
        }

        .form-group {
            margin-bottom: 1.3rem;
        }

        label {
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--ink-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.4rem;
            display: block;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.7rem 0.95rem;
            border: 1.5px solid var(--border-soft);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.18s ease;
            background-color: #FCFBF9;
            font-family: 'Inter', sans-serif;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--amber);
            box-shadow: 0 0 0 3px rgba(217, 123, 63, 0.15);
            background-color: #FFFFFF;
        }

        .login-btn {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background-color: var(--amber);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.18s ease;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            background-color: var(--amber-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(217, 123, 63, 0.3);
        }

        .error-alert {
            background-color: #FBEAE7;
            border: none;
            border-left: 4px solid var(--rust);
            color: var(--rust);
            font-weight: 600;
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-bottom: 1.4rem;
            font-size: 0.9rem;
        }

        .help-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--ink-muted);
            margin-top: 1.4rem;
        }

        .help-text a {
            color: var(--amber);
            text-decoration: none;
            font-weight: 600;
        }

        .help-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="logo">🏍️</div>
            <h1>Bike Repair System</h1>
            <p>Admin Login</p>
        </div>

        {% if error %}
        <div class="error-alert">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="help-text">
            Default: <strong>S.Piriyan</strong> / <strong>BII2832</strong>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
