<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">🔧 Bike Repair System</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/">🏠 Dashboard</a>
            <a class="nav-link" href="/customers">Customers</a>
            <a class="nav-link" href="/services">Services</a>
            <a class="nav-link" href="/inventory">Inventory</a>
            <a class="nav-link" href="/billing">Billing</a>
            <a class="nav-link" href="/analytics">Analytics</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>📊 Analytics Dashboard</h2>

    <!-- Total Revenue Card -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow text-center bg-success text-white">
                <div class="card-body p-4">
                    <h5>Total Revenue</h5>
                    <h2>RM {{ total_revenue }}</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Common Issues Chart -->
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">Most Common Issues</h5>
                </div>
                <div class="card-body">
                    <canvas id="issuesChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Daily Revenue Chart -->
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">Daily Revenue</h5>
                </div>
                <div class="card-body">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Common Issues Table -->
    <div class="card shadow mt-4">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Common Issues Breakdown</h5>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Issue</th>
                        <th>Count</th>
                    </tr>
                </thead>
                <tbody>
                    {% for issue in common_issues %}
                    <tr>
                        <td>{{ issue[0] }}</td>
                        <td>{{ issue[1] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Common Issues Chart
    var issueLabels = [{% for issue in common_issues %}"{{ issue[0] }}",{% endfor %}];
    var issueCounts = [{% for issue in common_issues %}{{ issue[1] }},{% endfor %}];

    new Chart(document.getElementById('issuesChart'), {
        type: 'bar',
        data: {
            labels: issueLabels,
            datasets: [{
                label: 'Number of Issues',
                data: issueCounts,
                backgroundColor: 'rgba(54, 162, 235, 0.7)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        }
    });

    // Daily Revenue Chart
    var revenueLabels = [{% for rev in daily_revenue %}"{{ rev[0] }}",{% endfor %}];
    var revenueData = [{% for rev in daily_revenue %}{{ rev[1] }},{% endfor %}];

    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: revenueLabels,
            datasets: [{
                label: 'Revenue (RM)',
                data: revenueData,
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 2,
                fill: true
            }]
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
